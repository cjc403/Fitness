name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（内存 H2，不需要数据库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fitness-backend/pom.xml
      - name: mvn -B clean package
        working-directory: fitness-backend
        run: mvn -B clean package

  frontend:
    name: 前端类型检查、构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitness-frontend/package-lock.json
      - name: npm ci
        working-directory: fitness-frontend
        run: npm ci
      - name: 构建（含 vue-tsc 类型检查）
        working-directory: fitness-frontend
        run: npm run build
      - name: 单元测试
        working-directory: fitness-frontend
        run: node --test tests/finance-ui.helpers.test.mjs tests/finance-runtime.test.mjs
