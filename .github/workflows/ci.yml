name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端测试（内存 H2，不需要数据库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fitness-backend/pom.xml
      - name: mvn -B clean package
        working-directory: fitness-backend
        run: mvn -B clean package

  frontend:
    name: 前端类型检查、构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitness-frontend/package-lock.json
      - name: npm ci
        working-directory: fitness-frontend
        run: npm ci
      - name: 构建（含 vue-tsc 类型检查）
        working-directory: fitness-frontend
        run: npm run build
      - name: 单元测试（node --test tests/，新增测试文件自动纳入）
        working-directory: fitness-frontend
        run: npm test

  deploy-scripts:
    name: 部署脚本测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: python -m unittest discover
        run: python -m unittest discover -s deploy/linux -p 'test_*.py' -v
