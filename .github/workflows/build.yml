name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端编译打包（跳过测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: fitness-backend/pom.xml
      - name: mvn -B -DskipTests package
        working-directory: fitness-backend
        run: mvn -B -DskipTests package

  frontend:
    name: 前端依赖安装与生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fitness-frontend/package-lock.json
      - name: npm ci
        working-directory: fitness-frontend
        run: npm ci
      - name: npm run build（含 vue-tsc 类型检查）
        working-directory: fitness-frontend
        run: npm run build
