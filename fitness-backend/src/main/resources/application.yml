spring:
  application:
    name: fitness-management-system
  
  datasource:
    url: jdbc:h2:file:./data/fitness;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=ROLE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  
  flyway:
    # Local H2 is managed by Hibernate. Production keeps the versioned PostgreSQL migrations.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment}
  expiration: 86400000 # 24小时 (毫秒)
  refresh-expiration: 604800000 # 7天 (毫秒)

# 应用配置
app:
  name: 健身房管理系统
  version: 1.4.0
  ai:
    enabled: ${AI_ENABLED:true}
    task-v2-enabled: ${AI_TASK_V2_ENABLED:true}
    planner-thinking-enabled: ${AI_PLANNER_THINKING_ENABLED:true}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    connect-timeout-seconds: ${DEEPSEEK_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${DEEPSEEK_READ_TIMEOUT:25}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:700}
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
    circuit-failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-seconds: ${AI_CIRCUIT_OPEN_SECONDS:60}
  cors:
    allowed-origins: 
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 日志配置
logging:
  level:
    root: INFO
    com.gym.fitness: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 运营自动化（定时任务）：整块可用 fitness.operations.enabled 关闭
fitness:
  operations:
    enabled: true
    # 过期未核销预约：默认只写日志提醒（首页也有提示）；设为 true 才会自动记爽约
    auto-resolve-overdue: false
    # 过期门禁令牌保留天数（便于排查，超出即清理）
    token-retention-days: 1
    # 权益到期提前提醒天数（7/3/1 天各提醒一次）
    expiry-reminder-days: 7
    overdue-cron: "0 10 7 * * *"
  # 消息通道：provider=MOCK 表示模拟发送，只记录投递、不会真的发出去
  messages:
    sms:
      enabled: true
      provider: MOCK
    email:
      enabled: true
      provider: MOCK
      from: no-reply@fitchain.local
    cleanup-cron: "0 30 3 * * *"
    reminder-cron: "0 0 9 * * *"

# Local development and the production reverse proxy use loopback by default.
# Explicit SERVER_ADDRESS can enable a different deployment topology.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
