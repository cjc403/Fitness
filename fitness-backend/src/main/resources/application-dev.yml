spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_db_dev
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:dev_pass}
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.gym.fitness: DEBUG
    org.springframework.web: DEBUG
